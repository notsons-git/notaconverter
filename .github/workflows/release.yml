name: Build & Release Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish to'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone EXE
        run: |
          pyinstaller notaconverter.spec --clean -y

      - name: Build Inno Setup Installer
        run: |
          choco install innosetup --no-progress
          pyinstaller notaconverter_dir.spec --clean -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NotAconverter-Windows
          path: |
            dist/NotAconverter-1.2.0.exe
            dist/NotAconverter-Setup-1.2.0.exe

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libfuse2 wget file

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Linux Binary
        run: |
          pyinstaller notaconverter.spec --clean -y

      - name: Package Linux AppImage (1-Click Run)
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/NotAconverter AppDir/usr/bin/NotAconverter
          cp assets/logo.png AppDir/logo.png
          cp assets/logo.png AppDir/.DirIcon
          cp assets/notaconverter.desktop AppDir/notaconverter.desktop
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/NotAconverter" "$@"
          EOF
          chmod +x AppDir/AppRun AppDir/usr/bin/NotAconverter
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          export ARCH=x86_64
          ./appimagetool --appimage-extract-and-run AppDir dist/NotAconverter-1.2.0-x86_64.AppImage

      - name: Package Linux DEB (Ubuntu / Debian / Mint)
        run: |
          mkdir -p deb_pkg/DEBIAN
          mkdir -p deb_pkg/usr/bin
          mkdir -p deb_pkg/usr/share/applications
          mkdir -p deb_pkg/usr/share/icons/hicolor/512x512/apps
          cat << 'EOF' > deb_pkg/DEBIAN/control
          Package: notaconverter
          Version: 1.2.0
          Section: graphics
          Priority: optional
          Architecture: amd64
          Maintainer: NotSons <https://github.com/notsons-git/notaconverter>
          Description: Telegram Video Sticker Converter (WebM VP9)
           Engineering suite for creating Telegram video stickers with alpha transparency.
          EOF
          cp dist/NotAconverter deb_pkg/usr/bin/notaconverter
          chmod 755 deb_pkg/usr/bin/notaconverter
          cp assets/notaconverter.desktop deb_pkg/usr/share/applications/notaconverter.desktop
          cp assets/logo.png deb_pkg/usr/share/icons/hicolor/512x512/apps/notaconverter.png
          sed -i 's/Icon=logo/Icon=notaconverter/g' deb_pkg/usr/share/applications/notaconverter.desktop
          sed -i 's/Exec=NotAconverter/Exec=notaconverter/g' deb_pkg/usr/share/applications/notaconverter.desktop
          dpkg-deb --build --root-owner-group deb_pkg dist/notaconverter_1.2.0_amd64.deb

      - name: Package Linux Tarball (Portable)
        run: |
          mkdir -p package/NotAconverter
          cp dist/NotAconverter package/NotAconverter/
          cp assets/logo.png package/NotAconverter/
          cp assets/notaconverter.desktop package/NotAconverter/
          cp README.md LICENSE package/NotAconverter/
          chmod +x package/NotAconverter/NotAconverter
          tar -czvf dist/NotAconverter-1.2.0-Linux-x86_64.tar.gz -C package NotAconverter

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NotAconverter-Linux
          path: |
            dist/NotAconverter-1.2.0-x86_64.AppImage
            dist/notaconverter_1.2.0_amd64.deb
            dist/NotAconverter-1.2.0-Linux-x86_64.tar.gz

  build-macos:
    name: Build macOS Apple Silicon
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS App Bundle
        run: |
          pyinstaller notaconverter.spec --clean -y

      - name: Package macOS DMG & ZIP
        run: |
          hdiutil create -volname "NotAconverter" -srcfolder dist/NotAconverter.app -ov -format UDZO dist/NotAconverter-1.2.0-macOS-arm64.dmg
          cd dist
          zip -r -y NotAconverter-1.2.0-macOS-arm64.zip NotAconverter.app
          cd ..

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NotAconverter-macOS
          path: |
            dist/NotAconverter-1.2.0-macOS-arm64.dmg
            dist/NotAconverter-1.2.0-macOS-arm64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Display downloaded files
        run: ls -la release_assets

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.2.0' }}
          files: |
            release_assets/NotAconverter-1.2.0.exe
            release_assets/NotAconverter-Setup-1.2.0.exe
            release_assets/NotAconverter-1.2.0-x86_64.AppImage
            release_assets/notaconverter_1.2.0_amd64.deb
            release_assets/NotAconverter-1.2.0-Linux-x86_64.tar.gz
            release_assets/NotAconverter-1.2.0-macOS-arm64.dmg
            release_assets/NotAconverter-1.2.0-macOS-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
